name: M8 import regression gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Compile Python sources
        run: python -m compileall -q env scripts tests
      - name: Verify M8 scenario import
        env:
          PYTHONPATH: .
        run: python -c "from env.jin_hilla_scenario_env import JinHillaScenarioEnv; print('M8 scenario import OK')"
      - name: Run test suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
