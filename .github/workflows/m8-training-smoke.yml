name: M8 training smoke gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-colab.txt ]; then python -m pip install -r requirements-colab.txt; elif [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Install ML dependencies (SB3 smoke)
        run: python -m pip install "stable-baselines3>=2.0.0" "gymnasium>=0.29.0"
      - name: Run SB3 PPO training smoke test
        env:
          PYTHONPATH: .
        run: |
          python scripts/train_sb3_ppo.py --timesteps 512 --n-envs 2 --output smoke_artifacts
          test -f smoke_artifacts/ppo_m8_policy.zip
      - name: Run SB3 evaluation smoke test
        env:
          PYTHONPATH: .
        run: |
          python scripts/eval_sb3_ppo.py --model smoke_artifacts/ppo_m8_policy.zip --stats smoke_artifacts/vec_normalize.pkl --episodes 2 --output smoke_artifacts/evaluation.json
          test -f smoke_artifacts/evaluation.json
